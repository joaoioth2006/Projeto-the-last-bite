<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <title>The Last Bite</title>
  </head>
  <body>
    <main>
      <img id="logo" src="img/logo.png" alt="logo" />

      <section id="card">
        <h2>SEJA BEM-VINDO</h2>

        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="Digite seu e-mail:" />

        <label for="confirm_email"></label>
        <input id="confirm_email"type="email"placeholder="Confirme seu e-mail:"/>

        <label for="senha"></label>
        <input id="senha" type="password" placeholder="Digite sua senha:" />

        <label for="confirm_senha"></label>
        <input id="confirm_senha" type="password" placeholder="Confirme sua senha:"/>

        <button id="entrar">ENTRAR</button>
      </section>
    </main>
    <footer>
      2026 - Guarulhos - The Last Bite
    </footer>
  </body>
  <script src="login.js"></script>
</html>
